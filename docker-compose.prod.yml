
services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg15
    container_name: portfolio_db_prod
    env_file: 
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and session management
  redis:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.redis
    container_name: portfolio_redis_prod
    env_file:
      - .env
    volumes:
      - redis_data_prod:/data
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Django web application
  web:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_web_prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_volume_prod:/app/media
      - static_volume_prod:/app/staticfiles
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped

  # FastAPI RAG service
  rag:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rag
    container_name: portfolio_rag_prod
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./rag_service/src:/app
      - ./shared:/shared
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --workers 2

  # Celery worker for background tasks
  celery:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_celery_prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: 
      - .env
    volumes:
      - media_volume_prod:/app/media
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    command: celery -A portfolio_project worker --loglevel=info --concurrency=2

  # Celery beat for periodic tasks
  celery-beat:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_celery_beat_prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: 
      - .env
    volumes:
      - ./production_logs:/app/logs
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    command: celery -A portfolio_project beat --loglevel=info

  # Flower for monitoring Celery tasks (optional in production)
  flower:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: portfolio_flower_prod
    depends_on:
      redis:
        condition: service_healthy
    env_file: 
      - .env
    ports:
      - "127.0.0.1:5555:5555"  # Only accessible from localhost
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    command: celery -A portfolio_project flower --port=5555

  # Nginx reverse proxy
  nginx:
    build:
      context: ./docker
      dockerfile: Dockerfile.nginx
    container_name: portfolio_nginx_prod
    depends_on:
      web:
        condition: service_healthy
      rag:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume_prod:/staticfiles:ro
      - media_volume_prod:/media:ro
      - ./ssl:/etc/letsencrypt:ro
      - ./ssl-challenges:/var/www/certbot:ro
      - ./production_logs/nginx:/var/log/nginx
    networks:
      - portfolio_network_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: portfolio_certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl-challenges:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email opaldecisionsciences@gmail.com --agree-tos --no-eff-email --staging -d opaldecisionsciences.com -d www.opaldecisionsciences.com
    profiles:
      - ssl-setup

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_volume_prod:
  static_volume_prod:

networks:
  portfolio_network_prod:
    driver: bridge